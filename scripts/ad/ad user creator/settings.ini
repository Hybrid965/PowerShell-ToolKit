[Application]
Name = AD Account Creator
Version = 4.0

[Company]
Name = Example Company Ltd
DefaultDomain = example.com
DefaultPhone = +44 (0)1234 567890

[ActiveDirectory]
NetBIOSDomain = EXAMPLE
DnsDomain = example.local
DefaultOU = Standard User

[UserNaming]
SamAccountName = {first}.{last}
UPN = {first}.{last}
Email = {upn}@{domain}
DisplayName = {first} {last}
Description = {job_title}

[Exchange]
Enabled = true
Server = exchange.example.local

[Paths]
BackendScript = ADUserBackend.ps1

[OUOptions]
Standard User = OU=Users,OU=Example,DC=example,DC=local
IT User = OU=IT,OU=Users,OU=Example,DC=example,DC=local
Finance User = OU=Finance,OU=Users,OU=Example,DC=example,DC=local
Operations User = OU=Operations,OU=Users,OU=Example,DC=example,DC=local
Contractor = OU=Contractors,OU=Users,OU=Example,DC=example,DC=local

[TodoItems]
01 = Add required groups
02 = Assign Microsoft 365 licence
03 = Confirm mailbox created
04 = Update phone number in AD
05 = Update HR/IT system
06 = Send account details to manager
